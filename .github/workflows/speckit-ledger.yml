name: Spec Kit GitHub Ledger

on:
  pull_request:
    paths:
      - "specs/**/tasks.md"
      - "specs/**/github-ledger.json"
  push:
    paths:
      - "specs/**/tasks.md"
      - "specs/**/github-ledger.json"
  workflow_dispatch:

concurrency:
  group: speckit-ledger-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
    uses: gptcompany/gobabygo/.github/workflows/speckit-ledger-reusable.yml@9e329decd8809a86f733ad426d2e6ab06278b417
    with:
      mode: plan
      runtime_ref: 9e329decd8809a86f733ad426d2e6ab06278b417

  apply:
    if: (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    uses: gptcompany/gobabygo/.github/workflows/speckit-ledger-reusable.yml@9e329decd8809a86f733ad426d2e6ab06278b417
    with:
      mode: apply
      runtime_ref: 9e329decd8809a86f733ad426d2e6ab06278b417
